<!doctype html>
<meta charset="utf-8">
<title>Salon Style Directions</title>
<style>
__FONTS__
  * { box-sizing: border-box; margin: 0; }
  body { background: #0c0a09; font-family: Inter, sans-serif; padding: 24px; display: grid; gap: 24px; justify-content: center; }
  .dir { width: 1360px; height: 820px; border-radius: 28px; overflow: hidden; display: grid; grid-template-columns: 420px 1fr; background: var(--page); color: var(--ink); position: relative; }
  .info { padding: 48px 40px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); }
  .num { font: 700 13px/1 Inter; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
  .info h2 { font-family: var(--fh); font-weight: var(--fhw); font-size: 46px; line-height: 1.02; letter-spacing: var(--fhls, -.01em); }
  .from { font-size: 14px; color: var(--muted); }
  .from b { color: var(--ink); }
  .mood { font-size: 16px; line-height: 1.5; color: var(--ink); opacity: .86; }
  .sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: auto; }
  .sw div { display: grid; gap: 6px; font: 600 10.5px/1.2 Inter; color: var(--muted); }
  .sw i { height: 58px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
  .sw b { color: var(--ink); font-size: 11px; }
  .fonts { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  .fonts span { color: var(--ink); font-size: 20px; }
  .stage { display: flex; align-items: center; justify-content: center; gap: 48px; background: var(--stage); }
  /* phone */
  .ph { width: 300px; height: 636px; border-radius: 42px; overflow: hidden; position: relative; background: var(--phbg); box-shadow: 0 0 0 8px var(--frame), 0 40px 70px -30px rgba(0,0,0,.6); font-family: var(--fb); color: var(--pink, var(--ink)); }
  .scr { position: absolute; inset: 0; padding: 30px 18px 90px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: var(--cborder); border-radius: var(--r); box-shadow: var(--cshadow); backdrop-filter: blur(14px); padding: 14px; }
  .lbl { font: 700 9.5px/1 var(--fb); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .search { height: 46px; border-radius: var(--rp); display: flex; align-items: center; padding: 0 6px 0 18px; font-size: 14px; color: var(--muted); background: var(--card); border: var(--cborder); box-shadow: var(--cshadow); }
  .search i { margin-left: auto; width: 34px; height: 34px; border-radius: var(--rp); background: var(--accent); display: grid; place-items: center; color: var(--accentInk); font-style: normal; font-weight: 800; }
  .ring { width: 168px; height: 168px; margin: 2px auto 0; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
  .money { font-family: var(--fn); font-weight: var(--fnw); font-size: 30px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .sm { font-size: 11.5px; color: var(--muted); }
  .tbl { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 8px; }
  .tbl div { border-left: 1px solid var(--line); display: grid; gap: 2px; }
  .tbl div:first-child { border: 0; }
  .tbl b { font-family: var(--fn); font-weight: var(--fnw); font-size: 22px; }
  .tbl div:first-child b { color: var(--accent); }
  .tbl span { font-size: 9.5px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .nm { font-size: 14px; font-weight: 600; }
  .pay { background: var(--accent); color: var(--accentInk); border-radius: var(--rp); padding: 7px 11px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 56px; border-radius: var(--rd); background: var(--dock); border: var(--cborder); display: flex; align-items: center; justify-content: space-around; font-size: 9px; color: var(--muted); font-weight: 600; }
  .dock span { display: grid; justify-items: center; gap: 3px; }
  .dock span::before { content: ""; width: 16px; height: 16px; border-radius: 5px; border: 1.6px solid currentColor; }
  .dock .on { color: var(--accent); }
  .fab { width: 50px; height: 50px; margin-top: -30px; border-radius: var(--rp); background: var(--accent); color: var(--accentInk); display: grid; place-items: center; font-size: 26px; font-weight: 400; box-shadow: 0 8px 18px rgba(0,0,0,.3), 0 0 0 4px var(--phsolid); }
  .ttl { font-family: var(--fh); font-weight: var(--fhw); font-size: 28px; line-height: 1.05; }
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--live); border: 1px solid var(--live); padding: 4px 8px; border-radius: var(--rp); }
  .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
  .chair { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .chair:first-of-type { border-top: 0; }
  .no { width: 34px; height: 34px; border-radius: var(--rp); display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--accent); color: var(--accentInk); }
  .no.free { background: transparent; border: 1.5px dashed var(--muted); color: var(--muted); }
  .pb { height: 5px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .pb i { display: block; height: 100%; background: var(--accent); }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; height: 64px; align-items: end; margin-top: 10px; }
  .bars i { display: block; background: var(--bar); border-radius: var(--rb); }
  .bars i.t { background: var(--accent); }
  .bars i.x { background: transparent; border: 1px dashed var(--line); height: 6px !important; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; text-align: center; font-size: 9px; color: var(--muted); margin-top: 4px; }
</style>
<body>
<div id="out"></div>
<script>
const D = [
 { n: "01 · Current", name: "Brown Studio Glass", from: "<b>impeccable</b> + <b>taste-skill</b> · the approved login look", mood: "Warm brown studio light, frosted glass cards, one gold accent for money and the main button. Dark, calm, high-end barbershop.",
   fh: "Urbanist", fhw: 500, fb: "Urbanist", fn: "Urbanist", fnw: 600,
   page: "#16100e", stage: "radial-gradient(80% 90% at 30% 20%, #3a2620, #120d0b)", ink: "#FFF8F1", muted: "rgba(255,248,241,.6)", line: "rgba(255,244,236,.14)",
   phbg: "radial-gradient(120% 75% at 15% 5%, #8E5B4E, #4A3029 45%, #1A1210)", phsolid: "#1f1512", frame: "#241a17",
   card: "linear-gradient(180deg, rgba(255,244,236,.2), rgba(255,244,236,.1))", cborder: "1px solid rgba(255,244,236,.28)", cshadow: "inset 0 1px 0 rgba(255,255,255,.25)",
   accent: "#E4A67B", accentInk: "#2A1710", accent2: "#FFF8F1", live: "#F08C6A", dock: "rgba(26,18,16,.75)", bar: "rgba(255,244,236,.5)",
   r: "22px", rp: "999px", rd: "28px", rb: "4px",
   sw: [["#8E5B4E","Glow"],["#4A3029","Mid brown"],["#1A1210","Deep"],["#E4A67B","Gold"],["#FFF8F1","Cream"]] },
 { n: "02", name: "Soft Luxe Cream", from: "<b>soft-skill</b> (high-end visual design)", mood: "Light and airy like a premium spa. Warm ivory, espresso text, champagne gold, very soft floating shadows and generous space.",
   fh: "Fraunces", fhw: 500, fb: "DM Sans", fn: "Fraunces", fnw: 600,
   page: "#F3EBE1", stage: "linear-gradient(160deg,#EFE4D6,#E5D5C2)", ink: "#2B1D17", muted: "#8A7566", line: "#EADFD1",
   phbg: "#F8F2EA", phsolid: "#F8F2EA", frame: "#E3D3C0",
   card: "#FFFDF9", cborder: "1px solid #EFE5D8", cshadow: "0 18px 40px -18px rgba(90,60,30,.28)",
   accent: "#B8894D", accentInk: "#FFFDF9", accent2: "#2B1D17", live: "#C0643F", dock: "#FFFDF9", bar: "#E2D2BD",
   r: "24px", rp: "999px", rd: "30px", rb: "6px",
   sw: [["#F8F2EA","Ivory"],["#FFFDF9","Card"],["#2B1D17","Espresso"],["#B8894D","Champagne"],["#D9C3A5","Sand"]] },
 { n: "03", name: "Editorial Minimal", from: "<b>minimalist-skill</b>", mood: "Like a fashion magazine. Warm paper white, flat cards with thin lines, a big serif headline and one terracotta accent. No gradients, no shadows.",

   r: "6px", rp: "6px", rd: "10px", rb: "2px",
   sw: [["#F7F4EF","Paper"],["#1F1D1A","Ink"],["#C0643F","Terracotta"],["#8A9A82","Sage"],["#E0DAD0","Line"]] },
 { n: "04", name: "Barber Brutalist", from: "<b>brutalist-skill</b> (industrial-brutalist-ui)", mood: "Bold and loud, like a barber-pole poster. Black, bone white and barber red, square corners, chunky type and hard offset shadows.",
   fh: "Archivo Black", fhw: 400, fhls: "-.02em", fb: "Space Grotesk", fn: "JetBrains Mono", fnw: 700,
   page: "#0E0E0E", stage: "repeating-linear-gradient(0deg,#121212 0 39px,#1c1c1c 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#1c1c1c 39px 40px)", ink: "#EDE6D6", muted: "#9A9488", line: "#3a3a3a",

   card: "#161616", cborder: "2px solid #EDE6D6", cshadow: "5px 5px 0 #D2372B",
   accent: "#D2372B", accentInk: "#EDE6D6", accent2: "#2E4C8C", live: "#D2372B", dock: "#161616", bar: "#EDE6D6",
   r: "0px", rp: "0px", rd: "0px", rb: "0px",
   sw: [["#0E0E0E","Black"],["#EDE6D6","Bone"],["#D2372B","Barber red"],["#2E4C8C","Pole blue"],["#3a3a3a","Steel"]] },
 { n: "05", name: "Emerald & Brass", from: "<b>ui-ux-pro-max</b> · luxury palette set", mood: "A classic gentleman's barber: deep bottle-green leather, polished brass, ivory text and a serif headline. Rich and traditional.",
   fh: "Playfair Display", fhw: 700, fb: "Urbanist", fn: "Playfair Display", fnw: 700,
   page: "#0d2019", stage: "radial-gradient(80% 90% at 30% 20%, #1d4636, #0a1813)", ink: "#F3EBDD", muted: "rgba(243,235,221,.6)", line: "rgba(243,235,221,.14)",
   phbg: "radial-gradient(120% 75% at 15% 5%, #2F6B53, #163A2F 45%, #0A1A14)", phsolid: "#0f251d", frame: "#12291f",
   card: "linear-gradient(180deg, rgba(243,235,221,.12), rgba(243,235,221,.05))", cborder: "1px solid rgba(201,162,77,.45)", cshadow: "inset 0 1px 0 rgba(255,255,255,.12)",
   accent: "#C9A24D", accentInk: "#132a21", accent2: "#F3EBDD", live: "#E07A5F", dock: "rgba(10,26,20,.8)", bar: "rgba(243,235,221,.45)",
   r: "14px", rp: "999px", rd: "22px", rb: "3px",
   sw: [["#2F6B53","Emerald"],["#163A2F","Bottle"],["#0A1A14","Night"],["#C9A24D","Brass"],["#F3EBDD","Ivory"]] },
 { n: "06", name: "Rose Salon", from: "<b>ui-ux-pro-max</b> · Beauty / Spa palette", mood: "Soft pink and plum with a lavender touch. Friendly and feminine, made for unisex and ladies' salons and beauty parlours.",
   fh: "Playfair Display", fhw: 700, fb: "DM Sans", fn: "DM Sans", fnw: 700,
   page: "#FDF2F8", stage: "linear-gradient(160deg,#FCE7F3,#F5E8FF)", ink: "#831843", muted: "#9D5C7E", line: "#FBCFE8",
   phbg: "linear-gradient(180deg,#FFF5FA,#FDF2F8)", phsolid: "#FFF5FA", frame: "#F7D3E6",
   card: "#FFFFFF", cborder: "1px solid #FBCFE8", cshadow: "0 14px 30px -16px rgba(131,24,67,.25)",
   accent: "#DB2777", accentInk: "#FFFFFF", accent2: "#8B5CF6", live: "#8B5CF6", dock: "#FFFFFF", bar: "#F9A8D4",
   r: "20px", rp: "999px", rd: "28px", rb: "6px",
   sw: [["#FDF2F8","Blush"],["#831843","Plum"],["#DB2777","Rose"],["#8B5CF6","Lavender"],["#F9A8D4","Petal"]] },

const C = 2 * Math.PI * 70;
function ring(d) {
  const a = 450 / 1050 * C, b = 600 / 1050 * C;
  return `<svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="70" fill="none" stroke="${d.line}" stroke-width="12"/>
  <circle cx="84" cy="84" r="70" fill="none" stroke="${d.accent2}" stroke-width="12" stroke-dasharray="${a - 4} ${C}"/>
  <circle cx="84" cy="84" r="70" fill="none" stroke="${d.accent}" stroke-width="12" stroke-dasharray="${b - 4} ${C}" stroke-dashoffset="${-a}"/></svg>`;
}
const staff = (d) => `<div class="ph"><div class="scr">
  <div class="search">Customer's mobile number <i>›</i></div>
  <div class="ring">${ring(d)}<div class="c"><div class="lbl">My earnings</div><div class="money">₹1,050</div><div class="sm">Today · Imran</div></div></div>
  <div class="sm" style="text-align:center">Cash ₹450 · Wallet ₹600 · Month ₹18,950</div>
  <div class="card"><div class="lbl">My customers today</div><div class="tbl"><div><b>3</b><span>Handled</span></div><div><b>2</b><span>Paid</span></div><div><b>1</b><span>In chair</span></div><div><b>0</b><span>New</span></div></div></div>
  <div class="card"><div class="lbl" style="margin-bottom:10px">My chair · Chair 1</div><div class="row"><div class="grow"><div class="nm">Karan Mehta</div><div class="sm">since 11:28 · Haircut + Beard</div></div><span class="pay">Pay ₹450</span></div></div>
  </div><div class="dock"><span class="on">Home</span><span>Customers</span><div class="fab">+</div><span>Reminders</span><span>Refer</span></div></div>`;
const owner = (d) => `<div class="ph"><div class="scr">
  <div class="row"><div class="grow"><div class="sm">Owner · from anywhere</div><div class="ttl">Live floor</div></div><span class="live">LIVE</span></div>
  <div class="card" style="padding-block:6px 10px">
   <div class="chair"><span class="no">1</span><div><div class="nm">Karan Mehta</div><div class="sm">Haircut + Beard · Imran</div><div class="pb"><i style="width:62%"></i></div></div><div class="sm" style="text-align:right"><b style="color:${d.ink}">₹450</b><br>11 min</div></div>
   <div class="chair"><span class="no">2</span><div><div class="nm">Priya Patel</div><div class="sm">Facial · Sunita</div><div class="pb"><i style="width:30%"></i></div></div><div class="sm" style="text-align:right"><b style="color:${d.ink}">₹900</b><br>31 min</div></div>
   <div class="chair"><span class="no free">3</span><div><div class="nm">Free</div><div class="sm">Rakesh · ready</div></div><div class="sm">1 waiting</div></div>
  </div>
  <div class="card"><div class="row"><div class="grow"><div class="lbl">Today</div><div class="money" style="font-size:34px">₹7,100</div></div><div class="sm" style="text-align:right">10 visits<br>▲ 12% vs last Wed</div></div>
   <div class="bars">${[62,70,90,100,56,0,30].map((v,i)=>`<i class="${i==6?'t':v==0?'x':''}" style="height:${v}%"></i>`).join("")}</div>
   <div class="days"><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span><span>Mo</span><span>Tu</span><span>We</span></div></div>
  </div><div class="dock"><span class="on">Live</span><span>Earnings</span><span>Attend.</span><span>Staff</span><span>Visits</span></div></div>`;
document.getElementById("out").innerHTML = D.map((d) => {
  const vars = Object.entries({ page: d.page, stage: d.stage, ink: d.ink, muted: d.muted, line: d.line, phbg: d.phbg, phsolid: d.phsolid, frame: d.frame, card: d.card, cborder: d.cborder, cshadow: d.cshadow, accent: d.accent, accentInk: d.accentInk, live: d.live, dock: d.dock, bar: d.bar, r: d.r, rp: d.rp, rd: d.rd, rb: d.rb, fh: `"${d.fh}"`, fhw: d.fhw, fb: `"${d.fb}"`, fn: `"${d.fn}"`, fnw: d.fnw, fhls: d.fhls || "-.01em" }).map(([k, v]) => `--${k}:${v}`).join(";");
  return `<section class="dir" style='${vars}'>
   <div class="info"><div class="num">Direction ${d.n}</div><h2>${d.name}</h2><div class="from">From ${d.from}</div><p class="mood">${d.mood}</p>
   <div class="fonts">Fonts<span style="font-family:'${d.fh}';font-weight:${d.fhw}">${d.fh}</span><span style="font-family:'${d.fb}'">${d.fb} for text</span></div>
   <div class="sw">${d.sw.map(([h, n]) => `<div><i style="background:${h}"></i><b>${n}</b>${h}</div>`).join("")}</div></div>
   <div class="stage">${staff(d)}${owner(d)}</div></section>`;
}).join("");
</script>
