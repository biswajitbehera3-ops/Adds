<title>Salon Login Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap">
<style>
  /* Layout: one phone-sized stage. Intro video → logo flies into the glass capsule's window → login. Brown studio backdrop with drifting barber tools. */
  :root {
    --glow: #8E5B4E;
    --mid: #4A3029;
    --deep: #1A1210;
    --ink: #FFF8F1;
    --ink-soft: rgba(255, 248, 241, 0.72);
    --glass: rgba(255, 244, 236, 0.13);
    --glass-edge: rgba(255, 244, 236, 0.32);
    --btn: #1E1A18;
    --accent: #E4A67B;
    --font: "Urbanist", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0E0A09; color: var(--ink); font-family: var(--font); }
  body { display: grid; place-items: center; padding-inline: 16px; overflow: hidden; }
  .wrap { display: grid; justify-items: center; gap: 14px; padding-block: 16px; }
  .stage {
    position: relative; width: min(390px, calc(100vw - 32px)); aspect-ratio: 390 / 820; max-height: calc(100vh - 90px);
    border-radius: 40px; overflow: hidden; isolation: isolate; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 9px #161110;
    container-type: inline-size;
  }
  @media (max-width: 480px) { .stage { width: 100vw; max-height: none; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; } body { padding: 0; } .controls { display: none; } }

  /* Backdrop */
  .bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 18% 8%, var(--glow) 0%, var(--mid) 45%, var(--deep) 100%); }
  .bg::after { content: ""; position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* Drifting objects */
  .obj { position: absolute; will-change: transform; }
  .obj svg { display: block; width: 100%; height: auto; }
  .scissors { width: 40cqw; right: -15cqw; top: 3%; --r: 32deg; animation: drift-a 9s ease-in-out infinite alternate; }
  .brush { width: 20cqw; left: 1cqw; top: 34%; --r: -16deg; animation: drift-b 7s ease-in-out infinite alternate; }
  .brush-near { width: 40cqw; right: -14cqw; bottom: -5%; --r: 22deg; filter: blur(5px); animation: drift-c 11s ease-in-out infinite alternate; }
  .comb { width: 34cqw; left: -8cqw; top: 4%; --r: -38deg; filter: blur(2.5px); opacity: .7; animation: drift-b 10s ease-in-out infinite alternate-reverse; }
  @keyframes drift-a { from { transform: translate(0, 0) rotate(var(--r)); } to { transform: translate(-3cqw, 4cqw) rotate(calc(var(--r) - 7deg)); } }
  @keyframes drift-b { from { transform: translate(0, 0) rotate(var(--r)); } to { transform: translate(2.5cqw, -3cqw) rotate(calc(var(--r) + 6deg)); } }
  @keyframes drift-c { from { transform: translate(0, 0) rotate(var(--r)); } to { transform: translate(3cqw, -2cqw) rotate(calc(var(--r) - 5deg)); } }

  /* Glass capsule (from the Moon reference) */
  .capsule {
    position: absolute; left: 50%; top: 50%; width: 72cqw; transform: translate(-50%, -50%);
    border-radius: 36cqw; padding: 3.4cqw 3.4cqw 6cqw; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(180deg, rgba(255,244,236,.20), rgba(255,244,236,.08) 40%, rgba(255,244,236,.14));
    border: 1px solid var(--glass-edge); backdrop-filter: blur(22px) saturate(1.25); -webkit-backdrop-filter: blur(22px) saturate(1.25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 30px 60px -20px rgba(0,0,0,.55);
  }
  .window { width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #000; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .window img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .content { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1cqw; padding: 3.5cqw 2.5cqw 0; text-align: center; }
  .kicker { font-weight: 400; font-size: 3.6cqw; color: var(--ink-soft); letter-spacing: .02em; }
  h1 { margin: .5cqw 0 0; font-weight: 400; font-size: 9cqw; line-height: 1.1; letter-spacing: -.01em; white-space: nowrap; }
  h1 span { display: inline-block; }
  .when { margin-top: 2.5cqw; font-size: 3.9cqw; line-height: 1.5; color: var(--ink); font-variant-numeric: tabular-nums; }
  .when b { font-weight: 600; }
  form { width: 100%; display: grid; gap: 2.4cqw; margin-top: 3cqw; }
  .field { position: relative; }
  .field input {
    width: 100%; height: 11.5cqw; border-radius: 6cqw; border: 1px solid rgba(255,244,236,.28); background: rgba(20,14,12,.28);
    color: var(--ink); font: 500 4cqw/1 var(--font); padding: 0 5cqw; outline: none; caret-color: var(--accent); transition: border-color .2s, background .2s;
  }
  .field input::placeholder { color: rgba(255,248,241,.55); }
  .field input:focus { border-color: var(--accent); background: rgba(20,14,12,.42); }
  .login {
    height: 12cqw; border: 0; border-radius: 6cqw; background: var(--btn); color: var(--ink); font: 600 4.4cqw/1 var(--font); letter-spacing: .02em;
    display: flex; align-items: center; justify-content: center; gap: 2cqw; cursor: pointer; transition: transform .1s ease-out; margin-top: 1cqw;
  }
  .login:active { transform: scale(.97); }
  .login:focus-visible, .owner:focus-visible, .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .login svg { width: 4.6cqw; height: 4.6cqw; }
  .login { justify-self: center; width: 100%; overflow: hidden; }
  .login .lab { display: inline-flex; align-items: center; gap: inherit; white-space: nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .owner { margin-top: 2.6cqw; background: none; border: 0; color: var(--ink-soft); font: 400 3.2cqw/1.4 var(--font); cursor: pointer; padding: 1cqw 2cqw; }
  .owner u { text-decoration-color: rgba(255,248,241,.4); text-underline-offset: 3px; }
  .msg { min-height: 4.6cqw; font-size: 3.3cqw; color: var(--accent); }

  /* Intro */
  .intro { position: absolute; inset: 0; z-index: 20; background: #000; display: grid; place-items: center; }
  .intro video { width: 100%; height: auto; display: block; }
  .skip { position: absolute; right: 4cqw; bottom: 5cqw; z-index: 21; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.35); color: #fff; font: 500 3.4cqw/1 var(--font); border-radius: 999px; padding: 2.2cqw 4cqw; cursor: pointer; }
  .flylogo { position: absolute; z-index: 25; border-radius: 50%; overflow: hidden; pointer-events: none; display: none; }
  .flylogo img { width: 100%; height: 100%; display: block; }

  .controls { display: flex; gap: 10px; }
  .controls button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--ink); font: 500 13px/1 var(--font); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .note { max-width: 390px; font-size: 12.5px; line-height: 1.5; color: rgba(255,248,241,.6); text-align: center; margin: 0; }

  @media (prefers-reduced-motion: reduce) { .obj { animation: none !important; } }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="bg"></div>

    <div class="obj comb" aria-hidden="true">
      <svg viewBox="0 0 200 60"><defs><linearGradient id="cb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2b211d"/><stop offset="1" stop-color="#120d0b"/></linearGradient></defs>
        <rect x="0" y="0" width="200" height="16" rx="5" fill="url(#cb)"/>
        <g fill="#1a1310">__COMB_TEETH__</g></svg>
    </div>

    <div class="obj scissors" aria-hidden="true">
      <svg viewBox="0 0 220 520">
        <defs>
          <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#f3f4f4"/><stop offset=".45" stop-color="#a9adb0"/><stop offset=".55" stop-color="#d8dadb"/><stop offset="1" stop-color="#7c8185"/></linearGradient>
          <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1c27d"/><stop offset=".4" stop-color="#c98a3b"/><stop offset=".7" stop-color="#f0b868"/><stop offset="1" stop-color="#8a5523"/></linearGradient>
        </defs>
        <path d="M92 300 L70 18 Q72 6 80 14 L118 296 Z" fill="url(#steel)" stroke="#6d7276" stroke-width="1.5"/>
        <path d="M122 300 L170 40 Q176 30 180 42 L134 304 Z" fill="url(#steel)" stroke="#6d7276" stroke-width="1.5" opacity=".95"/>
        <circle cx="114" cy="302" r="9" fill="#e9c58f" stroke="#7b5225" stroke-width="2"/>
        <path d="M108 312 Q96 360 78 392 Q52 410 46 448 Q44 496 86 500 Q128 500 124 452 Q120 418 98 400 Q114 364 122 318 Z M86 418 Q108 420 106 450 Q104 478 84 478 Q64 476 66 450 Q68 420 86 418 Z" fill="url(#gold)" fill-rule="evenodd" stroke="#6e4319" stroke-width="1.5"/>
        <path d="M122 314 Q138 352 154 384 Q182 398 186 436 Q190 478 156 486 Q122 490 120 452 Q118 420 140 400 Q128 360 116 320 Z M158 410 Q172 416 170 440 Q168 464 152 466 Q136 466 138 442 Q140 414 158 410 Z" fill="url(#gold)" fill-rule="evenodd" stroke="#6e4319" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="obj brush" aria-hidden="true">__BRUSH_SVG__</div>
    <div class="obj brush-near" aria-hidden="true">__BRUSH_SVG__</div>

    <section class="capsule" id="capsule" aria-label="Sign in">
      <div class="window" id="window"><img src="__LOGO__" alt="Salon logo: crossed scissors, combs, razor blade and shaving brush"></div>
      <div class="content">
        <div>
          <div class="kicker" id="kicker">good to see you</div>
          <h1 id="welcome" aria-label="Welcome back">Welcome back</h1>
          <div class="when"><div id="date">Tuesday, 14 October</div><b id="time">2:45 PM</b></div>
        </div>
        <form id="form" autocomplete="on" novalidate>
          <div class="field"><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="Mobile number" aria-label="Mobile number" maxlength="14"></div>
          <div class="field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"></div>
          <div class="msg" id="msg" role="status" aria-live="polite"></div>
          <button class="login" id="loginBtn" type="submit"><span class="lab" id="loginLab">Log in
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
        </form>
        <button class="owner" id="owner" type="button">Owner? <u>Sign in here</u></button>
      </div>
    </section>

    <div class="intro" id="intro">
      <video id="video" src="__VIDEO__" muted playsinline preload="auto" aria-label="Salon intro animation"></video>
      <button class="skip" id="skip" type="button">Skip</button>
    </div>
    <div class="flylogo" id="fly"><img src="__LOGO__" alt=""></div>
  </div>

  <div class="controls"><button type="button" id="replay">Replay intro</button></div>
  <p class="note">Prototype. Demo staff login: 98111 00001 / 1234. Owner: password owner1234. In the app, a staff login goes on to the attendance selfie.</p>
</div>

<script>
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const expo = "cubic-bezier(0.16, 1, 0.3, 1)";
  let ownerMode = false;

  // Live date and time (salon-local, Asia/Kolkata).
  function tick() {
    const now = new Date();
    $("date").textContent = now.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", timeZone: "Asia/Kolkata" });
    $("time").textContent = now.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" }).toUpperCase();
  }
  tick(); setInterval(tick, 10000);

  // Split the headline into letters for the #9 letter-by-letter reveal.
  const h = $("welcome");
  h.innerHTML = [..."Welcome back"].map((c) => `<span aria-hidden="true">${c === " " ? "&nbsp;" : c}</span>`).join("");

  function revealLogin(fromRect) {
    const cap = $("capsule");
    const win = $("window");
    // Logo flies from where the intro ended into the capsule's window (shared element).
    if (fromRect && !reduce) {
      const stage = $("stage").getBoundingClientRect();
      const to = win.getBoundingClientRect();
      const fly = $("fly");
      fly.style.display = "block";
      const box = (r) => ({ left: r.left - stage.left + "px", top: r.top - stage.top + "px", width: r.width + "px", height: r.height + "px" });
      Object.assign(fly.style, box(fromRect));
      win.style.opacity = "0";
      fly.animate([{ ...box(fromRect), borderRadius: "0%" }, { ...box(to), borderRadius: "50%" }], { duration: 900, easing: "cubic-bezier(0.65, 0, 0.35, 1)", fill: "forwards" })
        .finished.then(() => { win.style.opacity = "1"; fly.style.display = "none"; });
    }
    if (reduce) return;
    // R1 materialize: the glass capsule and its content.
    cap.animate([{ opacity: 0, transform: "translate(-50%, -48%) scale(.96)", filter: "blur(6px)" }, { opacity: 1, transform: "translate(-50%, -50%) scale(1)", filter: "blur(0)" }], { duration: 700, easing: expo, delay: 250, fill: "backwards" });
    $("kicker").animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 500, easing: expo, delay: 650, fill: "backwards" });
    [...h.children].forEach((s, i) => s.animate([{ opacity: 0, transform: "translateY(20px) rotateX(-40deg)" }, { opacity: 1, transform: "none" }], { duration: 600, easing: expo, delay: 700 + i * 15, fill: "backwards" }));
    [...document.querySelectorAll(".when, form > *, .owner")].forEach((el, i) =>
      el.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 450, easing: expo, delay: 900 + i * 60, fill: "backwards" }));
    document.querySelectorAll(".obj").forEach((o, i) => o.animate([{ opacity: 0 }, { opacity: getComputedStyle(o).opacity }], { duration: 900, delay: 200 + i * 120, fill: "backwards" }));
  }

  function endIntro() {
    const intro = $("intro");
    if (intro.dataset.done) return;
    intro.dataset.done = "1";
    const v = $("video");
    const vr = v.getBoundingClientRect();
    // The logo sits in the middle ~62% of the final intro frame.
    const s = vr.width * 0.62;
    const from = { left: vr.left + (vr.width - s) / 2, top: vr.top + (vr.height - s) / 2, width: s, height: s };
    v.pause();
    intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 450, fill: "forwards" }).finished.then(() => (intro.style.display = "none"));
    revealLogin(from);
  }

  function startIntro() {
    const intro = $("intro");
    const v = $("video");
    delete intro.dataset.done;
    intro.style.display = "grid";
    intro.getAnimations().forEach((a) => a.cancel());
    v.currentTime = 0;
    const p = v.play();
    if (p) p.catch(() => endIntro()); // autoplay blocked: go straight to login
  }
  $("video").addEventListener("ended", endIntro);
  $("skip").addEventListener("click", endIntro);
  $("replay").addEventListener("click", startIntro);

  // Prototype login (demo accounts only).
  $("owner").addEventListener("click", () => {
    ownerMode = !ownerMode;
    $("phone").parentElement.hidden = ownerMode;
    $("password").placeholder = ownerMode ? "Owner password" : "Password";
    $("owner").innerHTML = ownerMode ? "Staff? <u>Sign in with your number</u>" : "Owner? <u>Sign in here</u>";
    $("msg").textContent = "";
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const digits = $("phone").value.replace(/\D/g, "").slice(-10);
    const pw = $("password").value;
    const ok = ownerMode ? pw === "owner1234" : digits === "9811100001" && pw === "1234";
    if (ok) {
      morphLogin(ownerMode ? "Signed in. Opening the owner area." : "Signed in. Next: today's attendance selfie.");
    } else {
      $("msg").textContent = ownerMode ? "Wrong owner password" : "Wrong number or password";
      if (!reduce) $("capsule").animate([{ marginLeft: "0" }, { marginLeft: "-8px" }, { marginLeft: "7px" }, { marginLeft: "-4px" }, { marginLeft: "0" }], { duration: 320, easing: "ease-out" });
    }
  });

  // P1: the Log in button becomes a spinner, then a check (one shape, never cut).
  let morphing = false;
  async function morphLogin(done) {
    if (morphing) return; morphing = true;
    const btn = $("loginBtn"), lab = $("loginLab"), orig = lab.innerHTML;
    const out = (el) => reduce ? null : el.animate([{ opacity: 1, filter: "blur(0)" }, { opacity: 0, filter: "blur(4px)" }], { duration: 120, fill: "forwards" }).finished;
    const inn = (el) => reduce ? null : el.animate([{ opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0)" }], { duration: 180, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" }).finished;
    const w = btn.offsetWidth, h = btn.offsetHeight;
    await out(lab);
    if (!reduce) await btn.animate([{ width: w + "px", borderRadius: getComputedStyle(btn).borderRadius }, { width: h + "px", borderRadius: h / 2 + "px" }], { duration: 340, easing: "cubic-bezier(.3,1.25,.5,1)", fill: "forwards" }).finished;
    lab.innerHTML = '<svg viewBox="0 0 24 24" style="width:5.4cqw;height:5.4cqw;animation:spin .7s linear infinite"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2.6"/><path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
    await inn(lab);
    await new Promise((r) => setTimeout(r, reduce ? 0 : 750));
    await out(lab);
    lab.innerHTML = '<svg viewBox="0 0 24 24" style="width:5.6cqw;height:5.6cqw"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="24" stroke-dashoffset="24"><animate attributeName="stroke-dashoffset" to="0" dur=".28s" fill="freeze"/></path></svg>';
    await inn(lab);
    $("msg").textContent = done;
    setTimeout(async () => {
      await out(lab); btn.getAnimations().forEach((a) => a.cancel());
      lab.innerHTML = orig; await inn(lab); morphing = false;
    }, reduce ? 0 : 2200);
  }

  startIntro();
</script>
