<meta charset="utf-8">
<title>Bold Style Directions</title>
<style>
__FONTS__
  * { box-sizing: border-box; margin: 0; }
  body { background: #0c0a09; font-family: Inter, sans-serif; padding: 24px; display: grid; gap: 24px; justify-content: center; }
  .dir { width: 1360px; height: 820px; border-radius: 28px; overflow: hidden; display: grid; grid-template-columns: 420px 1fr; background: var(--page); color: var(--ink); position: relative; }
  .info { padding: 48px 40px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); }
  .num { font: 700 13px/1 Inter; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
  .info h2 { font-family: var(--fh); font-weight: var(--fhw); font-size: 46px; line-height: 1.02; letter-spacing: var(--fhls, -.01em); }
  .from { font-size: 14px; color: var(--muted); }
  .from b { color: var(--ink); }
  .mood { font-size: 16px; line-height: 1.5; color: var(--ink); opacity: .86; }
  .sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: auto; }
  .sw div { display: grid; gap: 6px; font: 600 10.5px/1.2 Inter; color: var(--muted); }
  .sw i { height: 58px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
  .sw b { color: var(--ink); font-size: 11px; }
  .fonts { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  .fonts span { color: var(--ink); font-size: 20px; }
  .stage { display: flex; align-items: center; justify-content: center; gap: 48px; background: var(--stage); }
  /* phone */
  .ph { width: 300px; height: 636px; border-radius: 42px; overflow: hidden; position: relative; background: var(--phbg); box-shadow: 0 0 0 8px var(--frame), 0 40px 70px -30px rgba(0,0,0,.6); font-family: var(--fb); color: var(--pink, var(--ink)); }
  .scr { position: absolute; inset: 0; padding: 30px 18px 90px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: var(--cborder); border-radius: var(--r); box-shadow: var(--cshadow); backdrop-filter: blur(14px); padding: 14px; }
  .lbl { font: 700 9.5px/1 var(--fb); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .search { height: 46px; border-radius: var(--rp); display: flex; align-items: center; padding: 0 6px 0 18px; font-size: 14px; color: var(--muted); background: var(--card); border: var(--cborder); box-shadow: var(--cshadow); }
  .search i { margin-left: auto; width: 34px; height: 34px; border-radius: var(--rp); background: var(--accent); display: grid; place-items: center; color: var(--accentInk); font-style: normal; font-weight: 800; }
  .ring { width: 168px; height: 168px; margin: 2px auto 0; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
  .money { font-family: var(--fn); font-weight: var(--fnw); font-size: 30px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .sm { font-size: 11.5px; color: var(--muted); }
  .tbl { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 8px; }
  .tbl div { border-left: 1px solid var(--line); display: grid; gap: 2px; }
  .tbl div:first-child { border: 0; }
  .tbl b { font-family: var(--fn); font-weight: var(--fnw); font-size: 22px; }
  .tbl div:first-child b { color: var(--accent); }
  .tbl span { font-size: 9.5px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .nm { font-size: 14px; font-weight: 600; }
  .pay { background: var(--accent); color: var(--accentInk); border-radius: var(--rp); padding: 7px 11px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 56px; border-radius: var(--rd); background: var(--dock); border: var(--cborder); display: flex; align-items: center; justify-content: space-around; font-size: 9px; color: var(--muted); font-weight: 600; }
  .dock span { display: grid; justify-items: center; gap: 3px; }
  .dock span::before { content: ""; width: 16px; height: 16px; border-radius: 5px; border: 1.6px solid currentColor; }
  .dock .on { color: var(--accent); }
  .fab { width: 50px; height: 50px; margin-top: -30px; border-radius: var(--rp); background: var(--accent); color: var(--accentInk); display: grid; place-items: center; font-size: 26px; font-weight: 400; box-shadow: 0 8px 18px rgba(0,0,0,.3), 0 0 0 4px var(--phsolid); }
  .ttl { font-family: var(--fh); font-weight: var(--fhw); font-size: 28px; line-height: 1.05; }
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--live); border: 1px solid var(--live); padding: 4px 8px; border-radius: var(--rp); }
  .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
  .chair { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .chair:first-of-type { border-top: 0; }
  .no { width: 34px; height: 34px; border-radius: var(--rp); display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--accent); color: var(--accentInk); }
  .no.free { background: transparent; border: 1.5px dashed var(--muted); color: var(--muted); }
  .pb { height: 5px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .pb i { display: block; height: 100%; background: var(--accent); }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; height: 64px; align-items: end; margin-top: 10px; }
  .bars i { display: block; background: var(--bar); border-radius: var(--rb); }
  .bars i.t { background: var(--accent); }
  .bars i.x { background: transparent; border: 1px dashed var(--line); height: 6px !important; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; text-align: center; font-size: 9px; color: var(--muted); margin-top: 4px; }

  .ph > .deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ph > .scr, .ph > .dock { z-index: 2; }
  .ph .dock { z-index: 3; }
  /* 1 Liquid glass */
  .lg .ph { background: #0b1020; }
  .lg .deco i { position: absolute; border-radius: 50%; filter: blur(26px); opacity: .85; }
  .lg .card, .lg .search, .lg .dock { backdrop-filter: blur(18px) saturate(190%); -webkit-backdrop-filter: blur(18px) saturate(190%); }
  .lg .card { position: relative; }
  .lg .card::after, .lg .search::after, .lg .dock::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,0) 28%, rgba(255,255,255,0) 70%, rgba(255,255,255,.25)); mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; -webkit-mask-composite: xor; padding: 1.2px; }
  .lg .search { position: relative; }
  /* 2 Aurora */
  .au .deco i { position: absolute; border-radius: 50%; filter: blur(38px); opacity: .9; }
  .au .money, .au .ttl { background: linear-gradient(90deg,#7CF7FF,#C084FC,#FF7AC6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .au .pay, .au .fab, .au .no:not(.free), .au .search i { background: linear-gradient(120deg,#22D3EE,#A855F7 55%,#F472B6); }
  .au .pb i, .au .bars i.t { background: linear-gradient(90deg,#22D3EE,#A855F7,#F472B6); }
  /* 3 Clay */
  .cl .card, .cl .search, .cl .dock { box-shadow: 14px 14px 28px rgba(124,58,237,.16), -10px -10px 22px rgba(255,255,255,.95), inset 4px 4px 8px rgba(255,255,255,.9), inset -4px -4px 10px rgba(124,58,237,.08); }
  .cl .pay, .cl .fab, .cl .no:not(.free), .cl .search i { background: linear-gradient(160deg,#A78BFA,#7C3AED); box-shadow: 0 8px 16px rgba(124,58,237,.35), inset 2px 2px 4px rgba(255,255,255,.45), inset -3px -3px 6px rgba(60,20,140,.35); }
  .cl .fab { box-shadow: 0 10px 20px rgba(124,58,237,.4), inset 3px 3px 6px rgba(255,255,255,.5), inset -4px -4px 8px rgba(60,20,140,.35), 0 0 0 5px #F4F1FA; }
  .cl .tbl b:nth-child(1) { color: #DB2777; }
  .cl .deco i { position: absolute; border-radius: 50%; box-shadow: inset 6px 6px 12px rgba(255,255,255,.7), inset -8px -8px 14px rgba(0,0,0,.12), 8px 12px 20px rgba(124,58,237,.18); }
  /* 4 Neo brutalism */
  .nb .card { transform: rotate(-.6deg); }
  .nb .card + .card { transform: rotate(.7deg); }
  .nb .pay, .nb .no:not(.free) { border: 2.5px solid #000; box-shadow: 3px 3px 0 #000; }
  .nb .fab { border: 3px solid #000; box-shadow: 4px 4px 0 #000, 0 0 0 0 transparent; }
  .nb .search i { border: 2.5px solid #000; }
  .nb .live { background: #FFD93D; color: #000; border: 2.5px solid #000; transform: rotate(4deg); box-shadow: 3px 3px 0 #000; }
  .nb .live::before { background: #FF6B6B; }
  .nb .bars i { border: 2px solid #000; }
  .nb .sticker { position: absolute; z-index: 4; font: 800 11px/1 "Space Grotesk"; background: #C4B5FD; border: 2.5px solid #000; padding: 6px 9px; border-radius: 999px; box-shadow: 3px 3px 0 #000; transform: rotate(-8deg); }
  /* 5 Cyberpunk */
  .cp .card, .cp .search, .cp .dock { clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
  .cp .card { border-color: #2A2A3A; box-shadow: none; background: linear-gradient(180deg, rgba(0,255,136,.06), #12121A 40%); }
  .cp .money, .cp .ttl { text-shadow: 0 0 12px rgba(0,255,136,.7); }
  .cp .tbl b { color: #00D4FF; text-shadow: 0 0 10px rgba(0,212,255,.6); }
  .cp .tbl div:first-child b { color: #FF00FF; text-shadow: 0 0 10px rgba(255,0,255,.7); }
  .cp .pay, .cp .fab, .cp .search i, .cp .no:not(.free) { box-shadow: 0 0 14px rgba(0,255,136,.7); }
  .cp .deco { background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  .cp .deco::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 160px; background: radial-gradient(60% 100% at 50% 0, rgba(255,0,255,.25), transparent); }
  .cp .lbl { color: #00FF88; }
  /* 6 Y2K chrome */
  .y2 .card, .y2 .search, .y2 .dock { background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(235,240,255,.7)); }
  .y2 .money, .y2 .ttl { background: linear-gradient(180deg,#ffffff 0%,#c9d2e6 35%,#6b7488 50%,#e6ecf7 62%,#8d97ad 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .4px #4a3d78; filter: drop-shadow(0 1px 0 rgba(74,61,120,.35)); }
  .y2 .pay, .y2 .fab, .y2 .search i, .y2 .no:not(.free) { background: linear-gradient(180deg,#ffb3dc,#FF69B4 45%,#c2187a); color: #fff; box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 6px 14px rgba(255,105,180,.45); }
  .y2 .deco i { position: absolute; border-radius: 50%; }
  .y2 .pb i, .y2 .bars i.t { background: linear-gradient(90deg,#00FFFF,#FF69B4,#9400D3); }
  /* 7 Modern dark cinema */
  .md .deco i { position: absolute; border-radius: 50%; filter: blur(40px); }
  .md .card { background: rgba(255,255,255,.04); }
  .md .pay, .md .fab, .md .search i, .md .no:not(.free) { box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 8px 24px rgba(94,106,210,.45); }
  /* 8 Kinetic acid */
  .ka .ttl, .ka .money { text-transform: uppercase; letter-spacing: -.02em; }
  .ka .marquee { position: absolute; z-index: 1; left: -20px; right: -20px; white-space: nowrap; font: 800 34px/1 "Space Grotesk"; color: #DFE104; text-transform: uppercase; opacity: .9; }
  .ka .card { border-color: #3F3F46; }
  .ka .chair:first-of-type, .ka .flood { background: #DFE104; color: #000; margin: 0 -14px; padding-inline: 14px; }
  .ka .chair:first-of-type .sm { color: #27272A; } .ka .chair:first-of-type .no { background: #000; color: #DFE104; } .ka .chair:first-of-type .pb i { background: #000; } .ka .chair:first-of-type .pb { background: rgba(0,0,0,.2); }
</style>
