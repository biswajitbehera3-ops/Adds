<!doctype html>
<!-- Full-frame transparent confetti burst (3 s) for podcast edits (1920x1080). Render as WebM to keep alpha. -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      .p { position: absolute; left: 960px; top: 420px; width: 22px; height: 34px; border-radius: 5px; }
      .p.round { width: 26px; height: 26px; border-radius: 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080"></div>
    <script>
      // seeded random so every render is identical
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const colors = ["#FFC83D", "#2EC4B6", "#FF4D4D", "#F6F1E7", "#FFA94D", "#FFFFFF"];
      const root = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      for (let i = 0; i < 90; i++) {
        const el = document.createElement("div");
        el.className = "p" + (i % 3 === 0 ? " round" : "");
        el.style.background = colors[i % colors.length];
        root.appendChild(el);
        const angle = rnd() * Math.PI * 2;
        const power = 380 + rnd() * 520;
        const dx = Math.cos(angle) * power;
        const up = Math.sin(angle) * power - 300;
        tl.fromTo(el, { x: 0, y: 0, rotation: 0, scale: 0.4, opacity: 1 },
          { x: dx * 0.55, y: up * 0.55, rotation: rnd() * 540, scale: 1, duration: 0.55, ease: "power3.out" }, 0);
        tl.to(el, { x: dx, y: up + 1100, rotation: "+=" + (360 + rnd() * 720), duration: 2.2, ease: "power1.in" }, 0.55);
        tl.to(el, { opacity: 0, duration: 0.4 }, 2.5);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
