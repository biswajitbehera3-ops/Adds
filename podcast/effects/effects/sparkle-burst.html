<!doctype html>
<!-- Twinkling star sparkles burst out from a point in the upper frame (2 s). Transparent; for reveals. -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      .sp { position: absolute; left: 960px; top: 300px; width: 70px; height: 70px; margin: -35px 0 0 -35px; }
      .sp svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080"></div>
    <script>
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const colors = ["#FFFFFF", "#FFC83D", "#2EC4B6", "#FFFFFF", "#FF4D4D"];
      const star = (c) => `<svg viewBox="0 0 100 100"><path fill="${c}" d="M50 0 C55 38 62 45 100 50 C62 55 55 62 50 100 C45 62 38 55 0 50 C38 45 45 38 50 0Z"/></svg>`;
      const root = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      for (let i = 0; i < 26; i++) {
        const el = document.createElement("div");
        el.className = "sp";
        el.innerHTML = star(colors[i % colors.length]);
        root.appendChild(el);
        const a = (i / 26) * Math.PI * 2 + rnd() * 0.4;
        const r = 160 + rnd() * 300;
        const t0 = rnd() * 0.35;
        const s = 0.35 + rnd() * 0.9;
        tl.fromTo(el, { x: 0, y: 0, scale: 0, rotation: 0, opacity: 1 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.7, scale: s, rotation: 90, duration: 0.7, ease: "power2.out" }, t0);
        tl.to(el, { scale: s * 0.4, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, t0 + 0.7);  // gentle twinkle
        tl.to(el, { opacity: 0, scale: 0, duration: 0.45, ease: "power1.in" }, 1.45 + rnd() * 0.1);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
